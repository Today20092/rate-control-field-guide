<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#0b0b0b;color:#f2efe8;font-family:'Archivo Narrow',sans-serif;text-transform:uppercase}
.field{background:#ff6a1a;height:520px;padding:60px 80px;color:#0b0b0b}
h1{font:700 104px/0.9 'Archivo Narrow';max-width:1000px}
.rail{height:150px;background:#0b0b0b;display:flex;align-items:center;gap:18px;padding:0 40px;position:relative}
.rail::before,.rail::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#f2efe8 0 18px,transparent 18px 40px)}
.rail::before{top:10px}.rail::after{bottom:10px}
.fr{flex:0 0 170px;height:90px;border:2px solid #f2efe8;display:flex;align-items:flex-end;padding:8px;font-size:13px}
.fr.on{background:#f2efe8;color:#0b0b0b}
.win{background:#f2efe8;color:#0b0b0b;margin:30px 80px;padding:24px;font:500 18px/1.5 'Archivo Narrow';text-transform:none;max-width:700px}
</style></head><body>
<div class="field"><p style="font-size:14px">Frame 03 / 07</p><h1>Store the motion, not the picture</h1></div>
<div class="rail"><div class="fr">01 Image</div><div class="fr">02 Intra</div><div class="fr on">03 I·P·B</div><div class="fr">04 Codecs</div><div class="fr">05 Bitrate</div><div class="fr">06 Trade-offs</div><div class="fr">07 Rate</div></div>
<div class="win">H.264 and H.265 keep a few full frames and describe the rest as movement plus small corrections.</div>
</body></html>
